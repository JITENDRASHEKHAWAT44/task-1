services:
  - type: web
    name: gemini-chatbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: MAX_CONTEXT_MESSAGES
        value: 10
      - key: GEMINI_API_KEY
        sync: false
